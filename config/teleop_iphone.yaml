teleop_iphone:
  ros__parameters:
    # The OSC node broadcasts iphone_odom -> iphone. The MPC/SLAM world is
    # the target frame consumed by go2_x5_planning.
    iphone_source_frame: "iphone_odom"
    iphone_target_frame: "iphone"
    goal_frame: "world"

    # go2_x5_planning accepts this PoseStamped and publishes native
    # ocs2_msgs/MpcTargetTrajectories for go2_x5_ocs2. The teleop node also
    # publishes the native target directly for setups without the planner.
    goal_topic: "/go2_x5/ee/goal"
    mpc_target_topic: "/mobile_manipulator_mpc_target"
    mpc_input_dim: 12
    ee_state_topic: "/go2_x5/ee/state"
    mode_topic: "/go2_x5/arm/mode/state"
    mode_request_topic: "/go2_x5/arm/mode/request"
    home_mode: "HOME"
    # F1 percentage commands width directly; release/stop holds last width.
    # Set marker to restore the filtered marker-based opening input.
    gripper_control_source: "button"
    gripper_button: 5
    gripper_command_topic: "/go2_x5/arm/gripper/command"
    gripper_open_width: 0.087
    gripper_closed_width: 0.0
    gripper_filter_alpha: 0.3
    gripper_deadband: 0.002
    touch_topic: "/iphone/touch"
    buttons_topic: "/iphone/buttons"
    tracking_ok_topic: "/iphone/tracking_ok"
    gripper_opening_topic: "/iphone/gripper/opening"
    status_topic: "/teleop_iphone/status"
    status_marker_topic: "/teleop_iphone/status_marker"

    # false: the phone's transmit switch is the clutch. Tracking engages
    # (re-anchored at the measured EE) whenever the stream is healthy and stops
    # when it goes inactive, loses tracking or times out.
    # true: additionally hold a finger outside the buttons to track.
    require_touch_clutch: false
    clutch_engage_delay: 0.15
    # After B HOME, stay disengaged until the arm mode changes or this expires.
    home_hold_time: 2.0
    touch_timeout: 0.50
    pose_timeout: 0.50
    ee_state_timeout: 0.50

    position_scale: 1.2
    rotation_scale: 0.6

    # Canonical slots: A/B/X/Y/F1/F2/F3/F4 (1-based).
    # A: tap to align; B: HOME; X/Y: OCS2/WBC.
    # F1: gripper percentage in either mode, 0% closed / 100% open.
    # F2: shared AR position/rotation multiplier, 50% = base scale.
    # F3: latched >50% rotation only, <=50% translation only.
    # F4: precision mode, both AR scales and base velocity x precision_factor.
    position_scale_button: 6
    home_button: 2
    axis_lock_button: 7
    rotation_scale_button: 0
    precision_button: 8
    align_button: 1
    ocs2_button: 3
    wbc_button: 4
    scale_slider_range: 3.0
    precision_factor: 0.3
    # The world +x is a mocap room axis, so align to the robot base heading
    # (go2_odometry publishes world -> odom -> base). Sampled once per A press.
    align_reference_frame: "base"
    # Initial yaw before the first A align. ARKit and world headings are both
    # arbitrary, so press A with the phone facing robot forward before use.
    phone_to_world_yaw: 1.5707963267948966
    # phone_to_world_yaw: 0.0
    control_rate: 60.0

    # Gamepad mode: left stick y/x -> base forward/left velocity, right stick
    # x -> yaw rate (stick right = turn right), scaled by the maxima below
    # (m/s, rad/s). rl_sar clamps them to the policy's limit_vel_* and drops
    # commands older than 0.25 s. ABXY use the canonical actions above; D-pad and L3/R3 are published only.
    # Steering: RT * (1 - LT) -> forward velocity, left.x -> yaw, no lateral motion.
    gamepad_topic: "/iphone/gamepad"
    base_velocity_topic: "/go2_x5/base/cmd_vel"
    gamepad_timeout: 0.2
    gamepad_max_linear_x: 0.8
    gamepad_max_linear_y: 0.4
    gamepad_max_yaw_rate: 1.0
